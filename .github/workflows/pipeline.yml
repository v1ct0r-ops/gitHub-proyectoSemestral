name: Python CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r webapp/requirements.txt

      - name: Run tests
        run: |
          pytest -q webapp/tests || (echo "Algún test falló" && exit 1)

      - name: Build (placeholder)
        run: echo "Build step (puede incluir packaging)"

      - name: Deploy to Render (placeholder)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -n "${RENDER_API_KEY}" ]; then
            echo "Deploy con RENDER_API_KEY presente (implementa deploy real aquí)."
          else
            echo "No hay RENDER_API_KEY, salto deploy."
          fi

      - name: Notify
        run: echo "Pipeline finalizado"
