<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Envío</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h2>Envíos - Factura {{ factura_id }}</h2>
    <form method="post">
      <div class="mb-2">
        <label>Estado</label>
        <select name="estado" class="form-control">
          <option value="pendiente">Pendiente</option>
          <option value="enviado">Enviado</option>
          <option value="entregado">Entregado</option>
        </select>
      </div>
      <div class="mb-2"><textarea name="notas" class="form-control" placeholder="Notas de despacho"></textarea></div>
      <button class="btn btn-primary">Registrar</button>
    </form>

    <h4 class="mt-4">Historial</h4>
    <ul>
      {% for e in historial %}
      <li>{{ e.fecha }} - {{ e.estado }} - {{ e.notas }}</li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>
