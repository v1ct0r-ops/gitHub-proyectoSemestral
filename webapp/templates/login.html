<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container d-flex align-items-center justify-content-center" style="min-height:75vh;">
    <div class="card shadow-sm" style="width:380px;">
      <div class="card-body">
        <div class="text-center mb-3">
          <img src="https://cdn-icons-png.flaticon.com/512/2922/2922561.png" alt="logo" width="72" height="72">
          <h4 class="card-title mt-2">Iniciar sesión</h4>
          <p class="text-muted small">Accede para gestionar órdenes y facturas</p>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for m in messages %}
              <div class="alert alert-warning" role="alert">{{ m }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="post" action="{{ url_for('login.do_login') }}">
          <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input name="username" class="form-control" placeholder="Ingresa tu usuario" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input name="password" type="password" class="form-control" placeholder="Contraseña" required>
          </div>
          <div class="d-grid">
            <button class="btn btn-primary">Entrar</button>
          </div>
        </form>

        <div class="text-center mt-3 small text-muted">
          ¿Problemas para entrar? Contacta al administrador.
        </div>
      </div>
    </div>
  </div>
</body>
</html>
